<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Phaser 3 - Granja y Círculo</title>
    <!-- Importamos Phaser 3 desde un CDN -->
    <!-- Usamos la versión minificada para carga rápida -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #333;
            /* Fondo oscuro fuera del juego */
        }
    </style>
</head>

<body>

    <script>
        // Configuración del juego
        const config = {
            type: Phaser.AUTO, // Phaser elige WebGL o Canvas automáticamente
            width: 800,        // Ancho del canvas
            height: 600,       // Alto del canvas
            backgroundColor: '#2d2d2d',
            physics: {
                default: 'arcade', // Usamos físicas arcade (simple y ligero)
                arcade: {
                    gravity: { y: 0 }, // Sin gravedad para este ejemplo
                    debug: false
                }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        // Inicializamos el juego con la configuración
        const game = new Phaser.Game(config);

        // Variables globales para nuestros objetos
        let personaje;
        let escopeta;
        let velocidad = 4; // Velocidad de movimiento (píxeles por frame)

        /**
         * Función PRELOAD
         * Aquí cargamos los recursos (imágenes, audios, etc.) antes de iniciar.
         */
        function preload() {
            // Carga de assets locales
            // Nota: Para que esto funcione, debes abrir el archivo HTML a través de un servidor local 
            // (por ejemplo, usando la extensión "Live Server" en VS Code) debido a seguridad del navegador.
            this.load.image('fondoGranja', './unnamed.jpg');
            // Usamos el archivo PNG que permite transparencia
            this.load.image('escopeta', './akiro-art-gun-shoot.png');
        }

        /**
         * Función CREATE
         * Aquí construimos los objetos en la escena una vez cargados los recursos.
         */
        function create() {
            // 1. AÑADIR FONDO
            // Colocamos la imagen en el centro. `setDisplaySize` asegura que cubra el canvas.
            const fondo = this.add.image(400, 300, 'fondoGranja');
            // Ajustamos el tamaño para asegurarnos que cubra 800x600 (opcional, por si la imagen es de otro tamaño)
            fondo.setDisplaySize(800, 600);

            // 2. CREAR PERSONAJE (CÍRCULO ROJO)
            personaje = this.add.circle(50, 300, 20, 0xff0000);

            // 3. AÑADIR ESCOPETA (Primer plano)
            // Usamos setOrigin(0.5, 1) para que el punto de anclaje sea: Centro Horizontal, Abajo Vertical
            // Así al ponerla en y=600, se queda pegada al borde inferior.
            escopeta = this.add.image(400, 600, 'escopeta');
            escopeta.setOrigin(0.5, 1);
            escopeta.setScale(0.8); // Ajustamos escala (puedes cambiar esto)

            // Guardamos la posición Y base para el retroceso
            const posY_base = 600;

            // 4. INTERACCIÓN (DISPARO)
            // Escuchamos el evento de clic en cualquier parte de la pantalla
            this.input.on('pointerdown', () => {
                // Animación de RETROCESO (Recoil)
                // Detenemos cualquier tween anterior
                this.tweens.killTweensOf(escopeta);
                escopeta.y = posY_base;

                // Tween: SUBE (y disminuye) y luego BAJA
                this.tweens.add({
                    targets: escopeta,
                    y: posY_base + 40, // Simulamos el golpe hacia "atrás" (abajo de la pantalla)
                    // Al estar anclada abajo, esto la esconde un poco.
                    // Si quieres que "salte" hacia arriba, usa: posY_base - 40
                    duration: 50,
                    yoyo: true // Vuelve a la posición original
                });
            });
        }

        /**
         * Función UPDATE
         * Se ejecuta continuamente (aprox 60 veces por segundo).
         * Aquí va la lógica del juego, input y movimiento.
         */
        function update() {
            // MOVIMIENTO HACIA LA DERECHA

            // Sumamos la velocidad a la posición X del personaje en cada frame.
            personaje.x += velocidad;

            // LÓGICA DE REAPARICIÓN (Wrapping)
            // Verificamos si la posición X del personaje es mayor que el ancho de la pantalla (800)
            // más un margen de seguridad (su radio: 20) para que salga completamente antes de desaparecer.
            if (personaje.x > 800 + 20) {
                // Si sale por la derecha, lo movemos a la izquierda fuera de pantalla.
                // Usamos -20 para que entre suavemente y no aparezca de golpe.
                personaje.x = -20;
            }

            // Si quisieras movimiento con teclado, usarías this.input.keyboard.createCursorKeys();
        }

    </script>

</body>

</html>
