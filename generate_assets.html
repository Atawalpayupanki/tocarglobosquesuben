<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Generar Assets Faltantes</title>
</head>

<body>
    <h1>Generando assets...</h1>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // ========================================
        // 1. MIRA (Crosshair)
        // ========================================
        function generateCrosshair() {
            canvas.width = 128;
            canvas.height = 128;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = 64;
            const centerY = 64;
            const radius = 50;

            // Círculo exterior rojo
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.stroke();

            // Círculo interior
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius - 10, 0, Math.PI * 2);
            ctx.stroke();

            // Cruz central
            ctx.lineWidth = 3;
            // Línea horizontal
            ctx.beginPath();
            ctx.moveTo(centerX - 20, centerY);
            ctx.lineTo(centerX + 20, centerY);
            ctx.stroke();
            // Línea vertical
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - 20);
            ctx.lineTo(centerX, centerY + 20);
            ctx.stroke();

            // Punto central
            ctx.fillStyle = '#ff0000';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 3, 0, Math.PI * 2);
            ctx.fill();

            downloadCanvas('mira.png');
        }

        // ========================================
        // 2. DESTELLO DE BOCA (Muzzle Flash)
        // ========================================
        function generateMuzzleFlash() {
            canvas.width = 256;
            canvas.height = 256;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = 128;
            const centerY = 128;

            // Resplandor amarillo-naranja
            const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, 100);
            gradient.addColorStop(0, 'rgba(255, 255, 200, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 200, 0, 0.9)');
            gradient.addColorStop(0.6, 'rgba(255, 100, 0, 0.6)');
            gradient.addColorStop(1, 'rgba(255, 50, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Estrella de destello
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
                const angle = (i * Math.PI) / 4;
                const length = i % 2 === 0 ? 80 : 40;
                const x = centerX + Math.cos(angle) * length;
                const y = centerY + Math.sin(angle) * length;
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();
            ctx.fill();

            downloadCanvas('destello_boca.png');
        }

        // ========================================
        // 3. PLUMA (Feather)
        // ========================================
        function generateFeather() {
            canvas.width = 64;
            canvas.height = 64;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = 32;
            const centerY = 32;

            // Forma de pluma simple
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 1;

            // Cuerpo de la pluma (elipse)
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, 8, 25, Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Línea central
            ctx.strokeStyle = '#999999';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(centerX - 5, centerY + 20);
            ctx.lineTo(centerX + 5, centerY - 20);
            ctx.stroke();

            // Detalles de pluma
            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 1;
            for (let i = -15; i < 15; i += 5) {
                ctx.beginPath();
                ctx.moveTo(centerX, centerY + i);
                ctx.lineTo(centerX - 6, centerY + i + 3);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(centerX, centerY + i);
                ctx.lineTo(centerX + 6, centerY + i + 3);
                ctx.stroke();
            }

            downloadCanvas('pluma.png');
        }

        // ========================================
        // Función para descargar el canvas
        // ========================================
        function downloadCanvas(filename) {
            canvas.toBlob(function (blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        }

        // Generar todos los assets automáticamente
        setTimeout(() => generateCrosshair(), 100);
        setTimeout(() => generateMuzzleFlash(), 600);
        setTimeout(() => generateFeather(), 1100);

        document.body.innerHTML += '<p>✅ Generando mira.png...</p>';
        setTimeout(() => {
            document.body.innerHTML += '<p>✅ Generando destello_boca.png...</p>';
        }, 600);
        setTimeout(() => {
            document.body.innerHTML += '<p>✅ Generando pluma.png...</p>';
            setTimeout(() => {
                document.body.innerHTML += '<p><strong>¡Listo! Guarda los 3 archivos en la carpeta assets/</strong></p>';
            }, 500);
        }, 1100);
    </script>
</body>

</html>
